name: test_adr_intel

on: [push, pull_request]

env:
  DOCKER_WORKING_DIR: '/home/dockeruser/OpenFOAM-AD'
  DOCKER_MOUNT_DIR: '/home/dockeruser/mount/OpenFOAM-AD'

jobs:

  test_adr_intel:
    runs-on: ubuntu-24.04
    name: Tests
    steps:
    - uses: actions/checkout@v3
    - name: Create the docker container and run the tests
      run: |
        docker pull dafoam/opt-packages:v5
        docker run -i -d -u dockeruser --name of_test -v $GITHUB_WORKSPACE:${{env.DOCKER_MOUNT_DIR}} dafoam/opt-packages:v5 /bin/bash
        docker exec -i of_test /bin/bash -c "cp -r ${{env.DOCKER_MOUNT_DIR}} ${{env.DOCKER_WORKING_DIR}}"
        docker exec -i of_test /bin/bash -c "echo 'dockeruser' | sudo -S wget -qO /etc/apt/trusted.gpg.d/intel-oneapi.asc https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
        docker exec -i of_test /bin/bash -c "echo 'dockeruser' | sudo -S bash -c 'echo \"deb https://apt.repos.intel.com/oneapi all main\" | sudo tee /etc/apt/sources.list.d/intel-oneapi.list'"
        docker exec -i of_test /bin/bash -c "echo 'dockeruser' | sudo -S bash -c 'apt-get update && apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mpi-devel'"
        docker exec -i of_test /bin/bash -c "cd ${{env.DOCKER_WORKING_DIR}} && sed -i 's/export WM_AD_MODE=.*/export WM_AD_MODE=ADR/' etc/bashrc && sed -i 's/export WM_MPLIB=.*/export WM_MPLIB=INTELMPI/' etc/bashrc && sed -i 's/export WM_COMPILER=.*/export WM_COMPILER=Icx/' etc/bashrc"
        docker exec -i of_test /bin/bash -c "cd ${{env.DOCKER_WORKING_DIR}} && . /opt/intel/oneapi/setvars.sh && . /opt/intel/oneapi/mpi/latest/env/vars.sh && . etc/bashrc && export WM_QUIET=true && ./Allwmake -j && ./renameAD.sh platforms/linux64IcxDPInt32OptADR --commit --ADR"
        docker exec -i of_test /bin/bash -c ". ${{env.DOCKER_WORKING_DIR}}/etc/bashrc && . /opt/intel/oneapi/setvars.sh && . /opt/intel/oneapi/mpi/latest/env/vars.sh && cd ${{env.DOCKER_WORKING_DIR}}/tests && ./Allrun.sh"
